<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <div class="login-header">
        <mat-icon class="login-icon">event_note</mat-icon>
        <h1>Gestor de Sesiones</h1>
        <p class="subtitle">Inicia sesión en tu cuenta</p>
      </div>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Correo electrónico</mat-label>
          <input matInput
                 formControlName="email"
                 type="email"
                 placeholder="usuario@ejemplo.com"
                 autocomplete="email">
          <mat-icon matSuffix>email</mat-icon>
          <mat-error>{{ emailError }}</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput
                 formControlName="password"
                 [type]="hidePassword ? 'password' : 'text'"
                 placeholder="Introduce tu contraseña"
                 autocomplete="current-password">
          <button mat-icon-button
                  matSuffix
                  type="button"
                  (click)="hidePassword = !hidePassword"
                  [attr.aria-label]="hidePassword ? 'Mostrar contraseña' : 'Ocultar contraseña'">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error>{{ passwordError }}</mat-error>
        </mat-form-field>

        <button mat-raised-button
                color="primary"
                type="submit"
                class="full-width login-btn">
          <mat-icon>login</mat-icon>
          Iniciar Sesión
        </button>
      </form>
    </mat-card-content>

    <mat-card-footer>
      <div class="hint">
        <p><strong>Acceso Admin:</strong> usa un correo que termine en <code>&#64;sdi.es</code></p>
        <p><strong>Acceso Usuario:</strong> cualquier otro correo válido</p>
        <p><strong>Contraseña:</strong> cualquier valor (mínimo 4 caracteres)</p>
      </div>
    </mat-card-footer>
  </mat-card>
</div>
